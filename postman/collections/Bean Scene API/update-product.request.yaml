$kind: http-request
name: Update Product
method: PUT
url: '{{base_url}}/api/products/{{created_product_id}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": "{{created_product_id}}",
      "name": "Rose Cardamom Reserve Latte (Updated)",
      "price": 5.75
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Updated product reflects new name and price', () => {
        const updated = pm.response.json();
        pm.expect(updated).to.be.an('object');
        pm.expect(updated.name).to.eql('Rose Cardamom Reserve Latte (Updated)');
        pm.expect(updated.price).to.eql(5.75);
      });
