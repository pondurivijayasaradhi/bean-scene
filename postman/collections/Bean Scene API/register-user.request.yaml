$kind: http-request
name: Register User
method: POST
url: '{{base_url}}/api/register'
order: 11000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Lakshmi Prasanna",
      "email": "{{test_user_email}}",
      "password": "BeanScenePassword123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200 or 400 (if already registered)', () => {
        pm.expect(pm.response.code).to.be.oneOf([200, 400]);
      });

      pm.test('Registration returns user object or duplicate email message', () => {
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (pm.response.code === 200) {
          pm.expect(body).to.have.property('user');
          pm.expect(body.user.email).to.eql(pm.variables.get('test_user_email'));
        } else {
          pm.expect(body).to.have.property('error');
        }
      });
