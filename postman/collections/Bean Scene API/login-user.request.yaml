$kind: http-request
name: Login User
method: POST
url: '{{base_url}}/api/login'
order: 12000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{test_user_email}}",
      "password": "BeanScenePassword123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Login returns auth token and user profile', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property('message', 'Login successful');
        pm.expect(body).to.have.property('token').that.is.a('string');
        pm.expect(body).to.have.property('user').that.is.an('object');
      });
