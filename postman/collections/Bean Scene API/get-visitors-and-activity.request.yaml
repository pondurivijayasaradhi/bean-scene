$kind: http-request
name: Get Visitors and Activity
method: GET
url: '{{base_url}}/api/visitors'
order: 15000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Returns visitors, users, and subscribers analytics feed', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property('status', 'ok');
        pm.expect(body).to.have.property('visitors').that.is.an('array');
        pm.expect(body).to.have.property('users').that.is.an('array');
        pm.expect(body).to.have.property('subscribers').that.is.an('array');
      });
